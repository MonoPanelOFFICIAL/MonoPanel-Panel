<!doctype html>
<html lang="en" class="dark mp-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>MonoPanel — Hosting</title>
    <meta name="description" content="MonoPanel offers high-performance hosting on reliable, low-latency infrastructure with real human support." />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/assets/icon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Space Grotesk is served locally (same file as MonoPanel Home), so no third-party font request is needed -->
    <link rel="preload" as="font" href="/fonts/space-grotesk-variable.woff2" type="font/woff2" crossorigin />

    <!-- MonoPanel boot loader (same "panel boot" screen as MonoPanel Home): styles live inline so it paints before any JS/CSS bundle loads -->
    <style>
      @font-face {
        font-family: "Space Grotesk Variable";
        src: url("/fonts/space-grotesk-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
        font-style: normal;
      }
      html, body { background: #000; margin: 0; }
      html.mp-loading { overflow: hidden; }
      #mp-loader {
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #000;
        color: #e0e0e0;
        font-family: "Space Grotesk Variable", "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        clip-path: inset(0 0 0 0);
        transition: clip-path 0.65s cubic-bezier(0.77, 0, 0.18, 1) 0.2s;
      }
      html.mp-loaded #mp-loader { clip-path: inset(0 0 100% 0); }
      .mp-l-stage {
        width: min(220px, 70vw);
        display: grid;
        justify-items: center;
        gap: 22px;
        transition: opacity 0.25s ease, transform 0.35s ease;
      }
      html.mp-loaded .mp-l-stage { opacity: 0; transform: translateY(-10px); }
      .mp-l-grid { display: grid; grid-template-columns: repeat(3, 28px); gap: 6px; }
      .mp-l-grid > i {
        display: block;
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.04);
        animation: mp-tile 1.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 110ms);
      }
      .mp-l-grid > .mp-l-core {
        display: grid;
        place-items: center;
        border-color: rgba(255, 255, 255, 0.55);
        background: transparent;
        animation: mp-core 1.8s ease-in-out infinite;
      }
      .mp-l-core img { width: 18px; height: auto; display: block; }
      .mp-l-line {
        width: 100%;
        margin: 0;
        display: flex;
        justify-content: space-between;
        font: 12px/1 ui-monospace, "SF Mono", "Fira Code", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c8c8c8;
      }
      .mp-l-label::after { content: "_"; animation: mp-blink 1s steps(1) infinite; }
      .mp-l-bar { width: 100%; height: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
      .mp-l-bar > span { display: block; height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; }
      .mp-l-ver {
        margin: 0;
        font: 11px/1 ui-monospace, "SF Mono", "Fira Code", monospace;
        letter-spacing: 0.08em;
        color: #707070;
      }
      @keyframes mp-tile {
        0%, 55%, 100% { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.2); transform: scale(1); }
        20% { background: #fff; border-color: #fff; transform: scale(1.1); }
      }
      @keyframes mp-core { 0%, 100% { border-color: rgba(255, 255, 255, 0.35); } 50% { border-color: #fff; } }
      @keyframes mp-blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .mp-l-grid > i, .mp-l-grid > .mp-l-core, .mp-l-label::after { animation: none; }
        #mp-loader, .mp-l-stage { transition: none; }
      }
    </style>
    <noscript><style>#mp-loader { display: none !important; } html.mp-loading { overflow: auto; }</style></noscript>

    <script>
      // Some browsers (in-app webviews, "block all cookies", old private modes) throw as soon as localStorage / sessionStorage
      // is touched. Every context in the app reads it during render, so one SecurityError used to blank the whole site.
      // Fall back to an in-memory store so the app still runs (the session just won't survive a reload).
      (function() {
        ['localStorage', 'sessionStorage'].forEach(function(name) {
          var ok = true;
          try { var s = window[name]; s.setItem('__mn_probe', '1'); s.removeItem('__mn_probe'); } catch (e) { ok = false; }
          if (ok) return;
          var data = {};
          var mem = {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
            setItem: function(k, v) { data[k] = String(v); },
            removeItem: function(k) { delete data[k]; },
            clear: function() { data = {}; },
            key: function(i) { return Object.keys(data)[i] || null; },
            get length() { return Object.keys(data).length; }
          };
          try { Object.defineProperty(window, name, { value: mem, configurable: true }); } catch (e) {}
        });
      })();
    </script>
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if (typeof window.global === 'undefined') {
            window.global = window;
          }
          try {
            var _currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            console.warn('Fetch property patch failed:', e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="mp-loader" role="status" aria-live="polite" aria-label="Loading MonoPanel">
      <div class="mp-l-stage">
        <div class="mp-l-grid" aria-hidden="true">
          <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
          <i style="--i:7"></i><i class="mp-l-core"><img src="/assets/logo.svg" alt="" width="18" height="13" /></i><i style="--i:3"></i>
          <i style="--i:6"></i><i style="--i:5"></i><i style="--i:4"></i>
        </div>
        <p class="mp-l-line"><span class="mp-l-label" id="mp-l-label">starting panel</span><span id="mp-l-pct">0%</span></p>
        <div class="mp-l-bar" aria-hidden="true"><span id="mp-l-fill"></span></div>
        <p class="mp-l-ver">MonoPanel</p>
      </div>
    </div>
    <script>
      // Same behaviour as the MonoPanel Home loader. The app calls window.__monoLoader.hide() once the session and
      // the hosting types have loaded; MIN_MS stops it flashing, MAX_MS stops it ever trapping the visitor.
      (function () {
        var root = document.documentElement;
        var el = document.getElementById('mp-loader');
        if (!el) return;
        root.classList.add('mp-loading');
        var fill = document.getElementById('mp-l-fill');
        var pctEl = document.getElementById('mp-l-pct');
        var label = document.getElementById('mp-l-label');
        var steps = ['starting panel', 'waking daemon', 'linking nodes', 'syncing state', 'ready'];
        var MIN_MS = 900, MAX_MS = 15000;
        var t0 = performance.now();
        var p = 0, done = false, hiding = false;

        function render() {
          fill.style.transform = 'scaleX(' + p / 100 + ')';
          pctEl.textContent = Math.round(p) + '%';
          label.textContent = steps[Math.min(steps.length - 1, Math.floor(p / 25))];
        }
        // Creep toward 90% while loading; the last 10% is the real "app is ready" signal.
        function tick() {
          if (done) return;
          var t = performance.now() - t0;
          p = Math.max(p, 90 * (1 - Math.exp(-t / 1400)));
          render();
          requestAnimationFrame(tick);
        }
        function finish() {
          if (done) return;
          done = true;
          var wait = Math.max(0, MIN_MS - (performance.now() - t0));
          setTimeout(function () {
            p = 100; render();
            root.classList.add('mp-loaded');
            setTimeout(function () {
              root.classList.remove('mp-loading', 'mp-loaded');
              if (el && el.parentNode) el.parentNode.removeChild(el);
              el = null;
            }, 900);
          }, wait);
        }
        function hide() {
          if (hiding) return;
          hiding = true;
          if (document.readyState === 'complete') finish();
          else window.addEventListener('load', finish, { once: true });
        }
        requestAnimationFrame(tick);
        window.__monoLoader = { hide: hide };
        setTimeout(hide, MAX_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
